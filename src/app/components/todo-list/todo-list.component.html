<div class="todo-container">
  <h1>Todo List</h1>
  <ul>
    <li *ngFor="let task of tasks">
      <span>{{ task }}</span>
      <button class="delete-btn">Delete</button>
    </li>
  </ul>
  <div class="add-task-container">
    <input type="text" placeholder="Add your new todo">
    <button class="add-btn">Add task</button>
  </div>
</div>
